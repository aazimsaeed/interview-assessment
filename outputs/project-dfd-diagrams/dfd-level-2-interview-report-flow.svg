<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1300" viewBox="0 0 2200 1300"><defs><marker id="arrow" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L14,8 L2,14 Z" fill="#111"/></marker><style>.title{font-family:Arial,Helvetica,sans-serif;font-size:46px;font-weight:800;fill:#111}.subtitle{font-family:Arial,Helvetica,sans-serif;font-size:20px;fill:#333}.heading{font-family:Arial,Helvetica,sans-serif;font-size:24px;font-weight:800;fill:#111}.procNo{font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:800;fill:#111}.small{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#111}.tiny{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#111}.label{font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;fill:#111}.entity,.process,.store{fill:#fff;stroke:#111;stroke-width:3}.flow{fill:none;stroke:#111;stroke-width:2.8;marker-end:url(#arrow)}</style></defs><rect width="2200" height="1300" fill="#fff"/><text x="1100" y="70" class="title" text-anchor="middle"><tspan x="1100" dy="0">Level 2 DFD - Interview &amp; Report Flow</tspan></text><text x="1100" y="112" class="subtitle" text-anchor="middle"><tspan x="1100" dy="0">Detailed decomposition of live monitoring, AI evaluation, and report saving</tspan></text>
<rect x="70" y="520" width="260" height="150" class="entity"/><text x="200" y="574" class="heading" text-anchor="middle"><tspan x="200" dy="0">CANDIDATE</tspan></text><text x="200" y="610" class="small" text-anchor="middle"><tspan x="200" dy="0">starts session,</tspan><tspan x="200" dy="25">speaks answers</tspan></text>
<rect x="70" y="910" width="260" height="150" class="entity"/><text x="200" y="964" class="heading" text-anchor="middle"><tspan x="200" dy="0">BROWSER / CDN</tspan></text><text x="200" y="1000" class="small" text-anchor="middle"><tspan x="200" dy="0">camera, mic,</tspan><tspan x="200" dy="25">MediaPipe models</tspan></text>
<rect x="1880" y="455" width="245" height="145" class="entity"/><text x="2002.5" y="509" class="heading" text-anchor="middle"><tspan x="2002.5" dy="0">GEMINI AI</tspan></text><text x="2002.5" y="545" class="small" text-anchor="middle"><tspan x="2002.5" dy="0">answer scoring</tspan><tspan x="2002.5" dy="25">ideal answers</tspan></text>
<rect x="500" y="230" width="300" height="95" class="store"/><line x1="520" y1="230" x2="520" y2="325" stroke="#111" stroke-width="3"/><text x="542" y="262" class="procNo" text-anchor="start"><tspan x="542" dy="0">D3</tspan></text><text x="542" y="292" class="small" text-anchor="start"><tspan x="542" dy="0">INTERVIEWS</tspan></text><text x="542" y="318" class="tiny" text-anchor="start"><tspan x="542" dy="0">candidate, role, questions</tspan></text>
<rect x="500" y="455" width="280" height="125" rx="26" class="process"/><text x="530" y="489" class="procNo" text-anchor="start"><tspan x="530" dy="0">4.1</tspan></text><text x="640" y="518" class="heading" text-anchor="middle"><tspan x="640" dy="0">LOAD SESSION</tspan></text><text x="640" y="553" class="tiny" text-anchor="middle"><tspan x="640" dy="0">validate id, load</tspan><tspan x="640" dy="20">question queue</tspan></text>
<rect x="850" y="455" width="280" height="125" rx="26" class="process"/><text x="880" y="489" class="procNo" text-anchor="start"><tspan x="880" dy="0">4.2</tspan></text><text x="990" y="518" class="heading" text-anchor="middle"><tspan x="990" dy="0">MEDIA CAPTURE</tspan></text><text x="990" y="553" class="tiny" text-anchor="middle"><tspan x="990" dy="0">camera/mic stream,</tspan><tspan x="990" dy="20">timer, controls</tspan></text>
<rect x="1200" y="455" width="280" height="125" rx="26" class="process"/><text x="1230" y="489" class="procNo" text-anchor="start"><tspan x="1230" dy="0">4.3</tspan></text><text x="1340" y="518" class="heading" text-anchor="middle"><tspan x="1340" dy="0">LANDMARKS</tspan></text><text x="1340" y="553" class="tiny" text-anchor="middle"><tspan x="1340" dy="0">face, pose, hand</tspan><tspan x="1340" dy="20">landmarks</tspan></text>
<rect x="1550" y="455" width="280" height="125" rx="26" class="process"/><text x="1580" y="489" class="procNo" text-anchor="start"><tspan x="1580" dy="0">4.4</tspan></text><text x="1690" y="518" class="heading" text-anchor="middle"><tspan x="1690" dy="0">BEHAVIOR CHECKS</tspan></text><text x="1690" y="553" class="tiny" text-anchor="middle"><tspan x="1690" dy="0">lighting, gaze, posture,</tspan><tspan x="1690" dy="20">blink, gesture, movement</tspan></text>
<rect x="850" y="740" width="280" height="125" rx="26" class="process"/><text x="880" y="774" class="procNo" text-anchor="start"><tspan x="880" dy="0">4.5</tspan></text><text x="990" y="803" class="heading" text-anchor="middle"><tspan x="990" dy="0">SPEECH CAPTURE</tspan></text><text x="990" y="838" class="tiny" text-anchor="middle"><tspan x="990" dy="0">transcript, WPM,</tspan><tspan x="990" dy="20">filler words</tspan></text>
<rect x="1200" y="740" width="280" height="125" rx="26" class="process"/><text x="1230" y="774" class="procNo" text-anchor="start"><tspan x="1230" dy="0">5.1</tspan></text><text x="1340" y="803" class="heading" text-anchor="middle"><tspan x="1340" dy="0">ANSWER EVALUATION</tspan></text><text x="1340" y="838" class="tiny" text-anchor="middle"><tspan x="1340" dy="0">question + transcript,</tspan><tspan x="1340" dy="20">score + feedback</tspan></text>
<rect x="1550" y="740" width="280" height="125" rx="26" class="process"/><text x="1580" y="774" class="procNo" text-anchor="start"><tspan x="1580" dy="0">6.1</tspan></text><text x="1690" y="803" class="heading" text-anchor="middle"><tspan x="1690" dy="0">BUILD REPORT</tspan></text><text x="1690" y="838" class="tiny" text-anchor="middle"><tspan x="1690" dy="0">metrics, timeline,</tspan><tspan x="1690" dy="20">snapshots</tspan></text>
<rect x="1550" y="1010" width="280" height="125" rx="26" class="process"/><text x="1580" y="1044" class="procNo" text-anchor="start"><tspan x="1580" dy="0">6.2</tspan></text><text x="1690" y="1073" class="heading" text-anchor="middle"><tspan x="1690" dy="0">SAVE / VIEW</tspan></text><text x="1690" y="1108" class="tiny" text-anchor="middle"><tspan x="1690" dy="0">dashboard, PDF,</tspan><tspan x="1690" dy="20">history access</tspan></text>
<rect x="1880" y="1030" width="240" height="95" class="store"/><line x1="1900" y1="1030" x2="1900" y2="1125" stroke="#111" stroke-width="3"/><text x="1922" y="1062" class="procNo" text-anchor="start"><tspan x="1922" dy="0">D4</tspan></text><text x="1922" y="1092" class="small" text-anchor="start"><tspan x="1922" dy="0">REPORTS</tspan></text><text x="1922" y="1118" class="tiny" text-anchor="start"><tspan x="1922" dy="0">metrics, report</tspan></text>

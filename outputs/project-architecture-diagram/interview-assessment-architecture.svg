<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <linearGradient id="frontend" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="clientai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcfce7"/>
      <stop offset="1" stop-color="#ccfbf1"/>
    </linearGradient>
    <linearGradient id="backend" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ede9fe"/>
      <stop offset="1" stop-color="#f3e8ff"/>
    </linearGradient>
    <linearGradient id="data" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#ffedd5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L11,6.5 L2,11 Z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L11,6.5 L2,11 Z" fill="#2563eb"/>
    </marker>
    <style>
      .title{font-family:Segoe UI,Arial,sans-serif;font-size:42px;font-weight:800;fill:#0f172a;letter-spacing:0}
      .subtitle{font-family:Segoe UI,Arial,sans-serif;font-size:18px;fill:#475569;letter-spacing:0}
      .section{font-family:Segoe UI,Arial,sans-serif;font-size:18px;font-weight:800;fill:#334155;letter-spacing:.3px;text-transform:uppercase}
      .boxTitle{font-family:Segoe UI,Arial,sans-serif;font-size:24px;font-weight:800;fill:#0f172a;letter-spacing:0}
      .boxSub{font-family:Segoe UI,Arial,sans-serif;font-size:15px;fill:#334155;letter-spacing:0}
      .small{font-family:Segoe UI,Arial,sans-serif;font-size:14px;fill:#475569;letter-spacing:0}
      .tiny{font-family:Segoe UI,Arial,sans-serif;font-size:12px;fill:#64748b;letter-spacing:0}
      .pillText{font-family:Segoe UI,Arial,sans-serif;font-size:13px;font-weight:700;fill:#334155;letter-spacing:0}
      .label{font-family:Segoe UI,Arial,sans-serif;font-size:13px;font-weight:700;fill:#334155;letter-spacing:0}
      .flow{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}
      .flowBlue{fill:none;stroke:#2563eb;stroke-width:3.5;marker-end:url(#arrowBlue)}
      .flowDashed{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:8 8;marker-end:url(#arrow)}
      .card{rx:22;filter:url(#shadow);stroke-width:1.5}
      .mini{rx:12;stroke-width:1}
    </style>
  </defs>

  <rect width="1600" height="1050" fill="url(#bg)"/>
  <text x="80" y="78" class="title">Interview Assessment System Architecture</text>
  <text x="82" y="112" class="subtitle">React browser app + client-side interview intelligence + FastAPI services + MongoDB persistence + Gemini AI</text>

  <!-- Users -->
  <text x="82" y="171" class="section">User Roles</text>
  <g filter="url(#shadow)">
    <rect x="80" y="190" width="235" height="130" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="125" cy="235" r="24" fill="#dbeafe" stroke="#93c5fd"/>
    <path d="M111 235c8-18 20-18 28 0M106 266c9-18 29-24 42 0" stroke="#1d4ed8" stroke-width="4" fill="none" stroke-linecap="round"/>
    <text x="168" y="230" class="boxTitle">Candidate</text>
    <text x="168" y="258" class="small">Takes interviews</text>
    <text x="168" y="280" class="small">views reports</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="80" y="350" width="235" height="130" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="125" cy="395" r="24" fill="#ede9fe" stroke="#c4b5fd"/>
    <path d="M111 395c8-18 20-18 28 0M105 426c10-18 30-24 43 0" stroke="#7c3aed" stroke-width="4" fill="none" stroke-linecap="round"/>
    <text x="168" y="390" class="boxTitle">Recruiter</text>
    <text x="168" y="418" class="small">Posts jobs, approves</text>
    <text x="168" y="440" class="small">creates assessments</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="80" y="510" width="235" height="130" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="125" cy="555" r="24" fill="#fee2e2" stroke="#fca5a5"/>
    <path d="M111 555c8-18 20-18 28 0M105 586c10-18 30-24 43 0" stroke="#dc2626" stroke-width="4" fill="none" stroke-linecap="round"/>
    <text x="168" y="550" class="boxTitle">Admin</text>
    <text x="168" y="578" class="small">Monitors users, ads</text>
    <text x="168" y="600" class="small">sessions, reports</text>
  </g>

  <!-- Frontend -->
  <rect x="395" y="160" width="390" height="500" class="card" fill="url(#frontend)" stroke="#93c5fd"/>
  <text x="425" y="205" class="boxTitle">React + Vite SPA</text>
  <text x="425" y="232" class="boxSub">Hash-routed frontend, deployed as static assets</text>
  <rect x="425" y="260" width="145" height="44" class="mini" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="447" y="288" class="pillText">Landing</text>
  <rect x="590" y="260" width="165" height="44" class="mini" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="615" y="288" class="pillText">Auth + OTP</text>
  <rect x="425" y="322" width="330" height="58" class="mini" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="448" y="347" class="pillText">Candidate Setup + Job Applications</text>
  <text x="448" y="367" class="tiny">pending interviews, history, profile</text>
  <rect x="425" y="398" width="330" height="58" class="mini" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="448" y="423" class="pillText">Recruiter Dashboard</text>
  <text x="448" y="443" class="tiny">ads, applicants, assessment creator, rankings</text>
  <rect x="425" y="474" width="330" height="58" class="mini" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="448" y="499" class="pillText">Interview Monitor</text>
  <text x="448" y="519" class="tiny">live interview UX, question flow, answer capture</text>
  <rect x="425" y="550" width="330" height="58" class="mini" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="448" y="575" class="pillText">Report Dashboard</text>
  <text x="448" y="595" class="tiny">gauges, timeline, snapshots, PDF export</text>
  <text x="425" y="637" class="tiny">State: React hooks + localStorage role/session values</text>

  <!-- Client Intelligence -->
  <rect x="860" y="160" width="400" height="500" class="card" fill="url(#clientai)" stroke="#86efac"/>
  <text x="890" y="205" class="boxTitle">Browser Intelligence Layer</text>
  <text x="890" y="232" class="boxSub">Runs in the candidate's browser during interviews</text>
  <rect x="890" y="260" width="340" height="58" class="mini" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="912" y="285" class="pillText">Camera + Microphone APIs</text>
  <text x="912" y="305" class="tiny">getUserMedia, stream controls, snapshots</text>
  <rect x="890" y="336" width="340" height="58" class="mini" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="912" y="361" class="pillText">MediaPipe Vision Tasks</text>
  <text x="912" y="381" class="tiny">FaceLandmarker, PoseLandmarker, HandLandmarker</text>
  <rect x="890" y="412" width="340" height="72" class="mini" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="912" y="437" class="pillText">Non-verbal Analysis Modules</text>
  <text x="912" y="457" class="tiny">lighting, face distance, position, emotion,</text>
  <text x="912" y="475" class="tiny">eye contact, posture, blink, gestures, movement</text>
  <rect x="890" y="502" width="340" height="58" class="mini" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="912" y="527" class="pillText">Speech + Interview Metrics</text>
  <text x="912" y="547" class="tiny">transcript, WPM, fillers, confidence/focus/stress</text>
  <rect x="890" y="578" width="340" height="58" class="mini" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="912" y="603" class="pillText">Local Report Assembly</text>
  <text x="912" y="623" class="tiny">timeline, answer snapshots, generated metrics</text>

  <!-- Backend -->
  <rect x="395" y="730" width="430" height="245" class="card" fill="url(#backend)" stroke="#c4b5fd"/>
  <text x="425" y="775" class="boxTitle">FastAPI Backend API</text>
  <text x="425" y="802" class="boxSub">Render-hosted REST service with CORS and schemas</text>
  <rect x="425" y="830" width="175" height="44" class="mini" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="444" y="858" class="pillText">Auth/Profile</text>
  <rect x="620" y="830" width="175" height="44" class="mini" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="642" y="858" class="pillText">Admin APIs</text>
  <rect x="425" y="892" width="175" height="44" class="mini" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="442" y="920" class="pillText">Jobs/Applications</text>
  <rect x="620" y="892" width="175" height="44" class="mini" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="646" y="920" class="pillText">Interviews/Reports</text>
  <text x="425" y="958" class="tiny">Pydantic models validate request/response payloads</text>

  <!-- Data -->
  <rect x="925" y="730" width="340" height="245" class="card" fill="url(#data)" stroke="#fdba74"/>
  <text x="955" y="775" class="boxTitle">MongoDB Database</text>
  <text x="955" y="802" class="boxSub">Async Motor client, indexed collections</text>
  <rect x="955" y="830" width="125" height="38" class="mini" fill="#ffffff" stroke="#fed7aa"/>
  <text x="974" y="854" class="pillText">recruiters</text>
  <rect x="1095" y="830" width="135" height="38" class="mini" fill="#ffffff" stroke="#fed7aa"/>
  <text x="1114" y="854" class="pillText">candidates</text>
  <rect x="955" y="882" width="125" height="38" class="mini" fill="#ffffff" stroke="#fed7aa"/>
  <text x="976" y="906" class="pillText">interviews</text>
  <rect x="1095" y="882" width="135" height="38" class="mini" fill="#ffffff" stroke="#fed7aa"/>
  <text x="1122" y="906" class="pillText">reports</text>
  <rect x="955" y="934" width="125" height="38" class="mini" fill="#ffffff" stroke="#fed7aa"/>
  <text x="970" y="958" class="pillText">advertisements</text>
  <rect x="1095" y="934" width="135" height="38" class="mini" fill="#ffffff" stroke="#fed7aa"/>
  <text x="1118" y="958" class="pillText">applications</text>

  <!-- External Services -->
  <text x="1340" y="171" class="section">External Services</text>
  <g filter="url(#shadow)">
    <rect x="1320" y="190" width="210" height="100" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1350" y="230" class="boxTitle">Gemini API</text>
    <text x="1350" y="258" class="small">questions, polish,</text>
    <text x="1350" y="280" class="small">answer scoring</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1320" y="330" width="210" height="100" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1350" y="370" class="boxTitle">EmailJS</text>
    <text x="1350" y="398" class="small">OTP emails from</text>
    <text x="1350" y="420" class="small">frontend flows</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1320" y="470" width="210" height="100" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1350" y="510" class="boxTitle">MediaPipe CDN</text>
    <text x="1350" y="538" class="small">WASM runtime and</text>
    <text x="1350" y="560" class="small">vision model files</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1320" y="610" width="210" height="100" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1350" y="650" class="boxTitle">PDF Export CDN</text>
    <text x="1350" y="678" class="small">html2pdf report</text>
    <text x="1350" y="700" class="small">download support</text>
  </g>

  <!-- Flows -->
  <path class="flowBlue" d="M315 255 C345 255 360 260 395 285"/>
  <path class="flowBlue" d="M315 415 C350 410 365 395 395 385"/>
  <path class="flowBlue" d="M315 575 C350 565 365 535 395 510"/>
  <text x="334" y="244" class="label">use web app</text>

  <path class="flowBlue" d="M785 410 C820 410 830 410 860 410"/>
  <text x="794" y="390" class="label">live capture + analysis</text>

  <path class="flow" d="M590 660 C590 692 590 704 590 730"/>
  <text x="612" y="704" class="label">REST API calls</text>

  <path class="flow" d="M825 855 C870 855 880 855 925 855"/>
  <text x="840" y="838" class="label">CRUD + indexes</text>

  <path class="flowDashed" d="M825 780 C1020 690 1190 350 1320 245"/>
  <text x="1028" y="586" class="label">generate/evaluate AI content</text>

  <path class="flowDashed" d="M785 330 C975 330 1135 355 1320 380"/>
  <text x="990" y="315" class="label">send OTP email</text>

  <path class="flowDashed" d="M1260 365 C1285 390 1300 435 1320 510"/>
  <text x="1240" y="458" class="label">load models</text>

  <path class="flowDashed" d="M785 590 C980 610 1120 650 1320 660"/>
  <text x="980" y="642" class="label">download report PDF</text>

  <path class="flowBlue" d="M1060 660 C1015 705 925 725 785 760"/>
  <text x="858" y="705" class="label">metrics + report payload</text>

  <!-- Legend -->
  <rect x="80" y="720" width="235" height="162" rx="18" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="105" y="755" class="boxTitle">Flow Legend</text>
  <line x1="108" y1="790" x2="178" y2="790" class="flowBlue"/>
  <text x="195" y="795" class="small">primary user flow</text>
  <line x1="108" y1="830" x2="178" y2="830" class="flow"/>
  <text x="195" y="835" class="small">backend/data flow</text>
  <line x1="108" y1="870" x2="178" y2="870" class="flowDashed"/>
  <text x="195" y="875" class="small">external service</text>

  <text x="80" y="1018" class="tiny">Generated from the project structure: src/pages, src/interview, src/check, src/audio, backend/main.py, backend/database.py, and src/config.js</text>
</svg>
